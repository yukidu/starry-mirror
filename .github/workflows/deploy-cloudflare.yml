name: Deploy Starry Mirror

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starry-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify Starry Mirror
        shell: bash
        run: |
          set -euxo pipefail
          node --check app-config.js
          node --check platform.js
          node --check starry-ui.js
          node --check mirror-app.js
          node --check mirror-enhancements.js
          node --check worker/index.js
          node --check worker/main.js
          node --check worker/v2.js
          node --check tests/bootstrap.test.mjs
          node --test tests/bootstrap.test.mjs
          node --check worker/ai-models.mjs
          node --check tests/ai-models.test.mjs
          node --test tests/ai-models.test.mjs
          grep -q 'rejectIfBusy: true' worker/ai-models.mjs
          grep -q '最長約 45 秒' mirror-app.js
          grep -q 'AbortController' mirror-app.js
          grep -q "@cf/qwen/qwen3.8-27b" worker/ai-models.mjs
          grep -q "@cf/openai/gpt-oss-120b" worker/ai-models.mjs
          grep -q "@cf/zai-org/glm-4.7-flash" worker/ai-models.mjs
          ! grep -q 'MIRROR_AI_MODEL' wrangler.toml
          node --check scripts/build-static.mjs
          node --check scripts/optimize-runtime.mjs
          node --check scripts/apply-mirror-runtime.mjs
          node --check scripts/fit-answer-overlay.mjs
          node --check scripts/configure-d1.mjs
          grep -q 'main = "worker/v2.js"' wrangler.toml
          grep -q 'pattern = "mirror.starry.phd"' wrangler.toml
          ! grep -q 'quotes.starry.phd' wrangler.toml
          grep -q "productionUrl: 'https://mirror.starry.phd/'" app-config.js
          grep -q 'accounts.google.com/gsi/client' platform.js
          grep -q "appId: 'starry-mirror'" platform.js
          grep -q '/api/google-sync' platform.js
          grep -q '/api/logout' platform.js
          grep -q '生命靈數_第一優先' worker/v2.js
          grep -q 'mirror_ai_ratings' worker/v2.js
          grep -q 'mirror_ai_ratings' schema.sql
          grep -q 'mirror_ai_reading_members' schema.sql
          grep -q '會員解籤紀錄' mirror-enhancements.js
          node scripts/build-static.mjs
          node scripts/optimize-runtime.mjs
          node scripts/apply-mirror-runtime.mjs
          node scripts/fit-answer-overlay.mjs
          test -s dist/index.html
          grep -q '繁星心鏡' dist/index.html
          grep -q 'Starry Mirror' dist/index.html
          grep -q 'starry-mirror-runtime' dist/index.html
          grep -q 'starry-mirror-enhancements' dist/index.html
          grep -q '/api/mirror/bootstrap' dist/index.html
          grep -q 'accounts.google.com/gsi/client' dist/index.html
          grep -q '登入繁星通行證' dist/index.html
          grep -q '我的收藏' dist/index.html
          grep -q 'AI解籤紀錄' dist/index.html
          grep -q '會員解籤紀錄' dist/index.html
          grep -q '/ai-rating' dist/index.html
          grep -q '本金句全體按讚' dist/index.html
          grep -q '超級管理員' dist/index.html
          grep -q 'mirror-battery-pop' dist/index.html
          grep -q '已抽' dist/index.html
          ! grep -q 'DeviceMotionEvent' dist/index.html
          ! grep -q 'devicemotion' dist/index.html
          ! grep -q 'handleShake' dist/index.html
          ! grep -q 'shakeRandomCard' dist/index.html
          ! grep -q 'shakeTutorialModal' dist/index.html
          ! grep -q 'closeShakeTutorial' dist/index.html
          ! grep -q '搖一搖' dist/index.html
          ! grep -q 'TOGGLE_LABELS' dist/index.html
          ! grep -q 'drawRewardEnabled' dist/index.html
          ! grep -q 'favoriteRewardEnabled' dist/index.html
          ! grep -q 'shareCostEnabled' dist/index.html
          ! grep -q 'aiCostEnabled' dist/index.html
          ! grep -q 'await autoImport(); window.randomStyle(true);' dist/index.html

      - name: Verify Cloudflare credentials
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Prepare Starry Mirror D1
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1.json
          if ! node -e "const x=require('/tmp/d1.json');const a=Array.isArray(x)?x:(x.result||[]);process.exit(a.some(r=>(r.name||r.database_name)==='starry_mirror_db')?0:1)"; then
            npx --yes wrangler@4 d1 create starry_mirror_db --location apac
            npx --yes wrangler@4 d1 list --json > /tmp/d1.json
          fi
          node scripts/configure-d1.mjs /tmp/d1.json
          grep -q 'binding = "MIRROR_DB"' wrangler.toml
          npx --yes wrangler@4 d1 execute starry_mirror_db --remote --file=./schema.sql --yes

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          user_agent='Mozilla/5.0 StarryMirrorProductionSmoke/1.0'
          for attempt in $(seq 1 18); do
            nonce="${GITHUB_SHA}-${attempt}"
            site_ok=0; health_ok=0; id_ok=0
            if curl -A "$user_agent" --connect-timeout 5 --max-time 15 -fsS "https://mirror.starry.phd/?smoke=${nonce}" -o /tmp/mirror.html; then
              if grep -q '繁星心鏡' /tmp/mirror.html && grep -q 'Starry Mirror' /tmp/mirror.html && grep -q '/api/mirror/bootstrap' /tmp/mirror.html && grep -q 'accounts.google.com/gsi/client' /tmp/mirror.html && grep -q 'AI解籤紀錄' /tmp/mirror.html && grep -q '會員解籤紀錄' /tmp/mirror.html && grep -q '/ai-rating' /tmp/mirror.html && ! grep -q 'shakeTutorialModal' /tmp/mirror.html && ! grep -q '搖一搖' /tmp/mirror.html && ! grep -q 'TOGGLE_LABELS' /tmp/mirror.html; then site_ok=1; fi
            fi
            if curl -A "$user_agent" --connect-timeout 5 --max-time 15 -fsS "https://mirror.starry.phd/api/mirror/health?smoke=${nonce}" -o /tmp/health.json; then
              if node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8'));if(x.app!=='starry-mirror'||x.status!=='ok'||x.d1!==true||x.ai!==true||x.bridge!==true)process.exit(1)"; then health_ok=1; fi
            fi
            code=$(curl -A "$user_agent" --connect-timeout 5 --max-time 15 -sS -o /tmp/id-session.json -D /tmp/id-session.headers -w '%{http_code}' -H 'Origin: https://mirror.starry.phd' "https://id.starry.phd/api/apps/starry-mirror/session?smoke=${nonce}" || true)
            tr -d '\r' < /tmp/id-session.headers > /tmp/id-session.clean || true
            if [ "$code" = '401' ] && grep -Eqi '^access-control-allow-origin: https://mirror\.starry\.phd$' /tmp/id-session.clean && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/id-session.json','utf8'));if(x.authenticated!==false)process.exit(1)"; then id_ok=1; fi
            echo "site=${site_ok}, health=${health_ok}, starry_id=${id_ok}"
            if [ "$site_ok" = 1 ] && [ "$health_ok" = 1 ] && [ "$id_ok" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo 'Starry Mirror production verification failed.' >&2
          exit 1

      - name: Verify real guest cards load from production D1
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -sS -A 'Mozilla/5.0 StarryMirrorBootstrapCheck/1.0' \
              --connect-timeout 5 --max-time 20 -o /tmp/bootstrap.json -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'X-Mirror-Device: starry-deploy-bootstrap-check-000001' \
              "https://mirror.starry.phd/api/mirror/bootstrap?verify=${GITHUB_SHA}-${attempt}" || true)
            if [ "$code" = 200 ] && node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/bootstrap.json','utf8'));if(x.app?.id!=='starry-mirror'||!Array.isArray(x.cards)||x.cards.filter(c=>Number(c.active)===1).length<1||!x.usage?.draws)process.exit(1)"; then
              echo 'Verified live bootstrap returns active cards and usage.'
              exit 0
            fi
            echo "Attempt ${attempt}: bootstrap HTTP ${code} (awaiting recovery)"
            sleep 6
          done
          echo 'Production guest card bootstrap failed.' >&2
          head -c 700 /tmp/bootstrap.json || true
          exit 1
