name = "starry-mirror"
main = "worker/v2.js"
compatibility_date = "2026-10-13"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "mirror.starry.phd"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[services]]
binding = "STARRY_ECOSYSTEM"
service = "echostars"

[vars]
MIRROR_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1HufZqMwvvZh735nBMvKnDDI-BnZMUuYmFTA0_3B2lCE/export?format=csv"
# 免費解籤模型依序列於 worker/ai-models.mjs：Qwen 3.8 27B → GPT-OSS 120B → GLM 4.7 Flash。
# 不啟用第三方付費 API；Workers Free 每日額度用完即停止，不會自動改用付費模型。

# MIRROR_DB 由 GitHub Actions 自動尋找或建立 starry_mirror_db 後，
# 在部署工作區加入正式 database_id，避免把不存在的 ID 寫死。
